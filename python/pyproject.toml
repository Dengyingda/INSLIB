# Packaging metadata for the INSLIB Python binding (PyPI: pip install inslib,
# the import name stays INSLIB). setup.py compiles the C library into the
# package, so both a wheel build and an editable install need a C compiler
# and the full repository checkout (the sources come from src/ and KFCore/):
#     pip install -e python/            # development, library built in place
#     python -m build --wheel python/   # one py3-none-<platform> wheel
# The release wheels for Linux/Windows/macOS come from cibuildwheel in
# .github/workflows/release-pypi.yml. The ctypes + flat-C-ABI design means
# one wheel per platform (not per Python version).

[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "INSLIB"
dynamic = ["version"]
description = "Python bindings and telemetry for the INSLIB navigation filter"
readme = "PYPI.md"
requires-python = ">=3.8"
authors = [{ name = "Jan Zwiener", email = "jan@zwiener.org" }]
license = "AGPL-3.0-or-later"
keywords = ["navigation", "kalman-filter", "ins", "gnss", "imu", "ahrs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
mavlink = ["pymavlink"]
plot = ["matplotlib"]
kml = ["simplekml", "pyproj"]
replay = ["pyyaml", "pymavlink", "matplotlib", "simplekml", "pyproj", "Pillow"]
# The host-side tools in tools/: pyserial for the serial link,
# pyubx2 for GNSS UBX decode, pymavlink for --mavlink.
recv = ["pyserial", "pyubx2", "pymavlink"]

# The YAML-configured CSV runner: inslib-run config.yaml
# (equivalent: python3 -m INSLIB config.yaml). Needs the 'replay' extra
# (PyYAML, pymavlink only for MAVLink output).
[project.scripts]
inslib-run = "INSLIB.runner:main"

[project.urls]
Homepage = "https://github.com/jnz/INSLIB"
Documentation = "https://github.com/jnz/INSLIB/blob/main/tutorial/python_tutorial.md"
Changelog = "https://github.com/jnz/INSLIB/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["INSLIB"]
# The shared library is no package data: setup.py's build_inslib writes a
# freshly compiled one into the build, so a stale or foreign-platform file
# lying in INSLIB/ never ends up in a wheel.
include-package-data = false

# INSLIB.__version__ is kept equal to the library release (CLAUDE.md
# release step 2, checked by python/tests/test_version.py).
[tool.setuptools.dynamic]
version = { attr = "INSLIB.__version__" }

# The py3-none tag covers every CPython, so one interpreter per platform is
# enough. Only 64-bit Windows: MinGW-w64 on the runners targets x86_64.
[tool.cibuildwheel]
build = "cp312-*"
test-command = "python {project}/python/tests/wheel_smoke.py"

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
